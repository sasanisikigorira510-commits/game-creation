<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>プレイヤーデータ管理</title>
<style>body{font:15px system-ui,sans-serif;background:#f3f5f8;color:#192331;margin:0}main{max-width:1100px;margin:40px auto;padding:0 24px}h1{font-size:28px}section{background:white;border:1px solid #dbe0e8;border-radius:12px;padding:22px;margin:18px 0}label{display:block;margin:10px 0}input{padding:10px;border:1px solid #bdc5d2;border-radius:6px;min-width:260px}button{padding:10px 18px;background:#264a77;color:white;border:0;border-radius:6px;margin:4px;cursor:pointer}button:disabled{opacity:.4;cursor:default}table{width:100%;border-collapse:collapse}td,th{padding:12px 8px;border-bottom:1px solid #e2e5eb;text-align:left}code{font-size:12px}pre{max-height:440px;overflow:auto;white-space:pre-wrap;background:#f5f7fa;padding:16px}small{color:#556176}#status{white-space:pre-wrap;color:#8c301c}#detail{display:none}.danger{background:#913f35}</style>
<main><h1>プレイヤーデータ管理</h1><p>保存履歴・異常の記録・ユーザー単位の復旧</p><small>端末の進行データは未検証です。検出された異常だけで不正行為と判断しないでください。</small>
<section><label>管理トークン <input id="token" type="password" autocomplete="off"></label><label>操作者 <input id="actor" placeholder="運営担当者名"></label><button id="load">ユーザー一覧を取得</button><div id="status" role="status"></div></section>
<section><label>ユーザーIDで絞り込み <input id="search" placeholder="ユーザーID"></label><table><thead><tr><th>ユーザーID</th><th>無償石 / 有償石</th><th>取引番号</th><th>状態</th></tr></thead><tbody id="players"></tbody></table></section>
<section id="detail"><h2 id="selected"></h2><label>操作理由 <input id="reason" placeholder="問い合わせ番号・不具合の内容"></label><button id="freeze">オンライン取引を停止</button><button id="unfreeze">オンライン取引を再開</button>
<details><summary>既存データの移行承認・通貨補正</summary><p>購入記録などを別途確認してから入力してください。補正は履歴付きの取引として追加されます。</p><label>無償石 <input id="free" type="number" value="0"></label><label>有償石 <input id="paid" type="number" value="0"></label><button id="migrate">上記残高で初回移行を承認</button><button id="adjust">上記の数を増減分として補正</button></details>
<h3>保存履歴</h3><div id="snapshots"></div><h3>復旧差分</h3><small>取引停止後に差分を確認してください。課金・ガチャ取引をまたぐ巻き戻しは拒否されます。復旧は端末で反映操作を行うまで保留されます。</small><pre id="diff">履歴の「差分を確認」を選んでください。</pre><button id="restore" class="danger" disabled>確認した差分で復旧を登録</button><h3>検出された異常</h3><pre id="flags"></pre><h3>操作・取引の履歴</h3><pre id="audit"></pre></section></main><script src="/admin.js"></script></html>
